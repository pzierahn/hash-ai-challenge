[project]
name = "hash-ai-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pzierahn", email = "patrick.zierahn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "elasticsearch>=9.5.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.17",
    "langchain-anthropic>=1.6.1",
    "langchain-google-genai>=4.3.5",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recruit"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
